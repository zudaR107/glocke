name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zudar107/schloss-server-kit build
      - run: pnpm --filter @zudar107/schloss-ui build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter backend db:generate
      - run: git diff --exit-code -- backend/src/db/migrations
      - run: docker compose config --quiet
        env:
          GLOCKE_TO_SCHLUSSEL_HMAC_SECRET: ci-only-schlussel-secret-at-least-32-bytes
          SCHLUSSEL_TO_GLOCKE_HMAC_SECRET: ci-only-producer-secret-at-least-32-bytes
      - run: docker compose build glocke-backend glocke-frontend
        env:
          GLOCKE_TO_SCHLUSSEL_HMAC_SECRET: ci-only-schlussel-secret-at-least-32-bytes
          SCHLUSSEL_TO_GLOCKE_HMAC_SECRET: ci-only-producer-secret-at-least-32-bytes
      - run: git diff --check
