name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: glocke-backend
            dockerfile: backend/Dockerfile
          - image: glocke-frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # GHCR requires lowercase; github.repository_owner preserves the
          # account's display case, so keep the known lowercase owner here.
          tags: |
            ghcr.io/zudar107/${{ matrix.image }}:latest
            ghcr.io/zudar107/${{ matrix.image }}:${{ github.sha }}
